name: Cursor PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  cursor-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # 如需在 PR 上评论

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 完整历史，便于 diff 分析

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Run Cursor Agent - PR Review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          agent -p "
            You are reviewing PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Focus on:
            1. Code quality and maintainability
            2. Security vulnerabilities
            3. Test coverage gaps
            4. Documentation

            Use 'gh pr diff' and 'gh pr view' to inspect the PR.
            Post a summary comment on the PR using 'gh pr comment'.
          " --model composer-2.5