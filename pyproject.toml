[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "taskipy>=1.14.1",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[tool.taskipy.tasks]
test = "pytest backend/tests/"
fmt = "black backend/ main.py"
lint = "ruff check backend/ main.py"
type-check = "mypy backend/ main.py --ignore-missing-imports"
quality = "task lint && task type-check && task test"
quality-fix = "ruff check --fix backend/ main.py && black backend/ main.py"

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  venv
  | \.venv
  | chroma_db
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["venv", ".venv", "chroma_db", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true
exclude = ["venv", ".venv", "chroma_db"]
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_incomplete_stub = false
allow_untyped_defs = true
allow_untyped_calls = true
check_untyped_defs = false
implicit_reexport = true
ignore_errors = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests combining multiple components",
    "api: API endpoint tests",
    "slow: Tests that take longer to run",
]
