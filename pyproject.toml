[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
    backend/chroma_db
  | \.tree
)/
'''

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["backend/chroma_db", ".tree"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear
select = ["E", "W", "F", "I", "B"]
# Line length is black's job; E501 would flag strings/comments black can't wrap.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# app.py installs a warnings filter before importing chromadb-dependent modules.
"backend/app.py" = ["E402"]

[tool.ruff.lint.isort]
# Backend modules are imported as top-level names (run from backend/).
known-first-party = [
    "ai_generator", "app", "config", "document_processor", "models",
    "rag_system", "search_tools", "session_manager", "vector_store",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
