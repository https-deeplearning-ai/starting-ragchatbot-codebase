[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "black>=24.0.0",
    "httpx>=0.28.0",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pytest.ini_options]
# Make both backend/ and backend/tests/ importable without sys.path hacks
pythonpath = ["backend", "backend/tests"]
testpaths = ["backend/tests"]
addopts = "-v --tb=short"
